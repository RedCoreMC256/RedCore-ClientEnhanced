
name: Build RedCore

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload RedCode JAR
        uses: actions/upload-artifact@v4
        with:
          name: RedCode-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
